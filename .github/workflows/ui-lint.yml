name: ui-lint self-test

on:
  push:
  pull_request:

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Self-test (failing fixtures must fail, passing ones must pass, suspicious must fire)
        run: node skills/ui-lint/test/selftest.mjs
      - name: Lint the passing fixtures through the CLI
        run: node skills/ui-lint/ui-lint.mjs skills/ui-lint/fixtures/pass
